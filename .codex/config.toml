#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
model_reasoning_effort = "high"

persistent_instructions = "Follow .codex/AGENTS.md and CLAUDE.md. Prefer repo-local skills in .codex/skills for issue execution, F1 data research, strategy self-QA, and MVP slice planning. Before commit, run ./.codex/scripts/self-qa.sh --staged or rely on installed git hooks. Keep work aligned to Git Flow from develop and do not commit directly to main or develop."

[features]
apps = false
multi_agent = true
[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
startup_timeout_sec = 30

