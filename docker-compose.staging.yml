services:
  backend:
    image: ghcr.io/529-studio/f1-virtual-engineer/backend:${IMAGE_TAG:-stg-latest}
    container_name: f1-backend
    pull_policy: always
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - core-network
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - SUPABASE_URL=${SUPABASE_URL:-https://yffuavatjbhegieytqda.supabase.co}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - FASTF1_CACHE_DIR=/app/backend/data
      - PYTHONPATH=/app/backend
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - fastf1-cache:/app/backend/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.http.routers.f1-backend.rule=Host(`f1-api.529studio.site`)"
      - "traefik.http.routers.f1-backend.entrypoints=web"
      - "traefik.http.services.f1-backend.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.20"
          memory: 256M

  frontend:
    image: ghcr.io/529-studio/f1-virtual-engineer/frontend:${IMAGE_TAG:-stg-latest}
    container_name: f1-frontend
    pull_policy: always
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - core-network
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-/api}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://yffuavatjbhegieytqda.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - GITHUB_URL=${GITHUB_URL:-https://github.com/529-studio/f1-virtual-engineer}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=core-network"
      - "traefik.http.routers.f1-frontend.rule=Host(`f1.529studio.site`)"
      - "traefik.http.routers.f1-frontend.entrypoints=web"
      - "traefik.http.services.f1-frontend.loadbalancer.server.port=3000"

volumes:
  fastf1-cache: {}

networks:
  core-network:
    external: true
