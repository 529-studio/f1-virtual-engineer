# Deployed to desk-srv-02 (Portainer environment 6). This stack MUST NOT rely on
# services running on desk-srv-01 (`redis`, `shared-postgres`, Traefik): all
# dependencies are either containerised here or reachable over the internet.
services:
  f1-redis:
    image: redis:7-alpine
    container_name: f1-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - core-network
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - no
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 96M

  backend:
    image: ghcr.io/529-studio/f1-virtual-engineer/backend:${IMAGE_TAG:-stg-latest}
    container_name: f1-backend
    pull_policy: always
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - core-network
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - SUPABASE_URL=${SUPABASE_URL:-https://yffuavatjbhegieytqda.supabase.co}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - REDIS_URL=redis://f1-redis:6379/0
      - FASTF1_CACHE_DIR=/app/backend/data/cache
      - PYTHONPATH=/app/backend
    depends_on:
      f1-redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - fastf1-cache:/app/backend/data/cache
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.20"
          memory: 256M

  frontend:
    image: ghcr.io/529-studio/f1-virtual-engineer/frontend:${IMAGE_TAG:-stg-latest}
    container_name: f1-frontend
    pull_policy: always
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - core-network
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-/api}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://yffuavatjbhegieytqda.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - GITHUB_URL=${GITHUB_URL:-https://github.com/529-studio/f1-virtual-engineer}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

volumes:
  fastf1-cache: {}

networks:
  core-network:
    external: true
