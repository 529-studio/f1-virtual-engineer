# ──────────────────────────────────────────────────────────────────────────────
# F1 Virtual Engineer — GitHub Actions CI/CD
# Replaces: .circleci/config.yml
# Registry: ghcr.io/529-studio/f1-virtual-engineer (GitHub Container Registry)
# Deploy:   Portainer stack update on develop push after both images are pushed
# ──────────────────────────────────────────────────────────────────────────────

name: CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/529-studio/f1-virtual-engineer/backend
  FRONTEND_IMAGE: ghcr.io/529-studio/f1-virtual-engineer/frontend

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Backend tests
  # ────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run unit tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests/ -v --tb=short

      - name: Strategy pit-accuracy gate (snapshot mode)
        env:
          PYTHONPATH: backend
          STRATEGY_PIT_EVAL_SNAPSHOT: "1"
        run: |
          python -m pytest backend/tests/test_strategy_pit_eval.py -s -v

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Frontend lint + type-check + build
  # ────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/.yarn/cache
            frontend/node_modules
          key: yarn-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: yarn-

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --immutable

      - name: Lint
        working-directory: frontend
        run: yarn lint

      - name: Build (type-check + bundle)
        working-directory: frontend
        env:
          # Only 2 vars are truly inlined into the client JS bundle by webpack.
          # Everything else has safe Dockerfile defaults or is server-side runtime.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: yarn build

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build & Push Docker images to GHCR
  # Only runs on push to develop (not PRs)
  # ────────────────────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    # Gate: only push images when both tests pass AND we're on develop
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write # Required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set SHORT_SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:sha-${{ env.SHORT_SHA }}
            ${{ env.BACKEND_IMAGE }}:stg-latest
          # Layer cache backed by GHCR (free, no TTL limit vs. GitHub cache)
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max
          provenance: false

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:sha-${{ env.SHORT_SHA }}
            ${{ env.FRONTEND_IMAGE }}:stg-latest
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max
          provenance: false
          # Only 2 vars get webpack-inlined into the client JS bundle at build time.
          # - NEXT_PUBLIC_SUPABASE_* used by "use client" supabase/client.ts + SupabaseProvider
          # - BACKEND_INTERNAL_URL: frozen into routes-manifest.json via next.config.ts rewrites(),
          #   but Dockerfile already has ARG BACKEND_INTERNAL_URL=http://backend:8000 (correct default)
          # - NEXT_PUBLIC_API_BASE_URL: has || "/api" fallback in code; Dockerfile ARG default = /api
          # - NEXT_PUBLIC_SITE_URL: server-side Route Handler only, so the compose runtime default
          #   https://f1.529studio.site is authoritative; it pins the auth callback origin
          # - NEXT_PUBLIC_ADMIN_USER_ID: dead code, not referenced in src/
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4: Trigger Portainer redeploy via API
  # Target stack and environment come from the PORTAINER_STACK_ID and
  # PORTAINER_ENDPOINT_ID repository secrets; no stack id is hardcoded here.
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy via Portainer
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    env:
      # Job-level so the tailnet step can test it in `if`: secrets are not
      # available in expressions, but their env projection is.
      TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Portainer is tailnet-only. The runner joins the tailnet when the OAuth
      # client is configured; until then the job keeps using the public Access
      # path, so this step is optional and the deploy never depends on it.
      - name: Join the tailnet for Portainer access
        if: env.TS_CLIENT_ID != ''
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trigger Portainer redeploy
        env:
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PORTAINER_TAILNET_URL: ${{ secrets.PORTAINER_TAILNET_URL }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
        run: |
          if [ -z "$PORTAINER_API_KEY" ]; then
            echo "PORTAINER_API_KEY is not set — skipping deploy trigger."
            exit 0
          fi
          if [ -z "$PORTAINER_STACK_ID" ]; then
            echo "::error::PORTAINER_STACK_ID secret is not set, so the target stack cannot be resolved"
            exit 1
          fi
          if [ -z "$PORTAINER_ENDPOINT_ID" ]; then
            echo "::error::PORTAINER_ENDPOINT_ID secret is not set, so the target Portainer environment cannot be resolved"
            exit 1
          fi
          if [ -n "$TS_CLIENT_ID" ]; then
            PORTAINER_BASE="${PORTAINER_TAILNET_URL}"
            echo "Reaching Portainer over the tailnet at ${PORTAINER_BASE}."
          else
            PORTAINER_BASE="https://portainer.529studio.site"
            echo "[WARN] TS_OAUTH_CLIENT_ID is not set; using the public Access path."
          fi
          echo "Triggering Portainer stack redeploy..."
          # The stack environment holds credentials and IMAGE_TAG only: every other
          # value is a default in docker-compose.staging.yml, so the repository owns
          # the configuration and the environment cannot silently override it.
          # Diagnostics carry variable names, never values.
          assert_stack_env() {
            local env_json="$1" compose_file="$2" required="$3" catalog
            catalog=$(grep -oE '\$\{[A-Z_][A-Z0-9_]*' "$compose_file" | sed 's/^\${//' | sort -u)
            echo "$env_json" | jq -e --arg req "$required" --arg cat "$catalog" '
              ($req | split(" ")) as $required_names
              | ([.[].name]) as $names
              | ($required_names - $names) as $missing
              | ([.[] | select(((.value // "") | length) == 0) | .name]) as $empty
              | ([.[] | select((.name | test("_(URL|ENDPOINT)$"))
                    and ((.name | test("_(DB|DATABASE)_URL$|_API_BASE_URL$|_BASE_URL$")) | not)
                    and (((.value // "") | test("^https?://")) | not)) | .name]) as $bad_web_url
              | ([.[] | select((.name | test("_(KEY|KEY_ID|SECRET|SECRET_ACCESS_KEY|TOKEN|PASSWORD)$"))
                    and (((.value // "") | length) < 8)) | .name]) as $weak_secret
              | ($names - ($cat | split("\n") | map(select(length > 0)))) as $unknown
              | if (($missing | length) + ($empty | length) + ($bad_web_url | length) + ($weak_secret | length) + ($unknown | length)) > 0
                then error("stack env assertion failed: missing=\($missing) empty=\($empty) bad_web_url=\($bad_web_url) weak_secret=\($weak_secret) unknown=\($unknown)")
                else "stack env assertions passed for \($names | length) names" end'
          }
          SHORT_SHA="${GITHUB_SHA::8}"
          STACK_RES=$(curl -sS -f -X GET "${PORTAINER_BASE}/api/stacks/${PORTAINER_STACK_ID}" \
            -H "X-API-Key: $PORTAINER_API_KEY" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "User-Agent: Mozilla/5.0")

          STACK_FILE=$(cat docker-compose.staging.yml)

          ENV_JSON=$(echo "$STACK_RES" | jq -e 'if (.Env | type) == "array" then .Env else error("CRITICAL: stack Env missing or not an array") end')
          ENV_JSON=$(echo "$ENV_JSON" | jq --arg t "sha-${SHORT_SHA}" 'map(select(.name != "IMAGE_TAG")) + [{"name":"IMAGE_TAG","value":$t}]')
          assert_stack_env "$ENV_JSON" docker-compose.staging.yml "GEMINI_API_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL"

          PAYLOAD=$(jq -n \
            --arg file "$STACK_FILE" \
            --argjson env "$ENV_JSON" \
            '{stackFileContent: $file, env: $env, prune: true, pullImage: true}')

          curl -sS -f -o /dev/null -X PUT "${PORTAINER_BASE}/api/stacks/${PORTAINER_STACK_ID}?endpointId=${PORTAINER_ENDPOINT_ID}" \
            -H "X-API-Key: $PORTAINER_API_KEY" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0" \
            -d "$PAYLOAD"

          echo "Portainer deploy completed successfully; verifying backend through frontend..."
          curl -fsS --retry 30 --retry-delay 5 --retry-all-errors --max-time 10 \
            https://f1.529studio.site/api
          echo "F1 smoke /api returned 200."

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 5: Notify the generic alert webhook (failure and deploy success)
  # ────────────────────────────────────────────────────────────────────────────
  notify-status:
    name: Notify Generic Webhook
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, build-push, deploy]
    if: always()

    steps:
      - name: Send alert to the generic webhook
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_OPS_WEBHOOK_URL: ${{ secrets.ALERT_OPS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.sha }}
          TB_RES: ${{ needs.test-backend.result }}
          TF_RES: ${{ needs.test-frontend.result }}
          BP_RES: ${{ needs.build-push.result }}
          DP_RES: ${{ needs.deploy.result }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
        run: |
          set -euo pipefail

          if [ "$TB_RES" = "failure" ] || [ "$TF_RES" = "failure" ] || [ "$BP_RES" = "failure" ] || [ "$DP_RES" = "failure" ]; then
            CHANNEL="alerts"
            TITLE="[ERR] CI/CD pipeline failed: $REPOSITORY"
            MESSAGE="Pipeline failed on branch $BRANCH at commit $COMMIT_MSG (jobs: backend=$TB_RES frontend=$TF_RES build=$BP_RES deploy=$DP_RES). Run: $RUN_URL"
          elif [ "$DP_RES" = "success" ]; then
            CHANNEL="ops"
            TITLE="[OK] Staging deploy succeeded: $REPOSITORY"
            MESSAGE="F1 Virtual Engineer was built and deployed to staging (Portainer stack ${STACK_ID:-unknown}) on branch $BRANCH at commit $COMMIT_MSG. Run: $RUN_URL"
          else
            echo "[INFO] no alert: deploy=$DP_RES"
            exit 0
          fi

          if [ "$CHANNEL" = "ops" ]; then
            URL="${ALERT_OPS_WEBHOOK_URL:-}"
          else
            URL="${ALERT_WEBHOOK_URL:-}"
          fi
          if [ -z "$URL" ]; then
            echo "::error::ALERT_WEBHOOK_URL/ALERT_OPS_WEBHOOK_URL secret is not set for channel $CHANNEL, so this run could not be reported"
            exit 1
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg message "$MESSAGE" \
            --arg channel "$CHANNEL" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{content: ("**" + $title + "**\n" + $message),
              text: ("**" + $title + "**\n" + $message),
              event: $title,
              source: "f1-ci-cd (GitHub Actions)",
              timestamp: $timestamp,
              channel: $channel,
              title: $title,
              message: $message}')

          CODE=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: f1-ci-cd/1.0' \
            -d "$PAYLOAD")
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "::error::alert delivery to channel $CHANNEL failed with HTTP $CODE"
            exit 1
          fi
          echo "[OK] alert delivered to channel $CHANNEL (HTTP $CODE)"
